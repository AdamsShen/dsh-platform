services:
  postgres:
    image: postgres:16
    container_name: ao-pg
    environment:
      POSTGRES_USER: ao
      POSTGRES_PASSWORD: ao
      POSTGRES_DB: ao
    ports:
      - "55433:5432"
    volumes:
      - ao-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ao -d ao"]
      interval: 2s
      timeout: 2s
      retries: 30
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

volumes:
  ao-pg-data:
