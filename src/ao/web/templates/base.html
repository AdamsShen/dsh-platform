<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AO 创作面{% endblock %}</title>
  <style>
    :root {
      --paper: #f7f5f0;
      --ink: #1f2421;
      --muted: #6b7168;
      --line: #ddd8cc;
      --accent: #2f5d50;
      --accent-soft: #e4ece7;
      --warn: #a4412f;
      --warn-soft: #f6e7e3;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    code, textarea, input[type="text"] {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    a { color: var(--accent); }
    .top {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; padding: 18px 28px; border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.55);
    }
    .brand { font-weight: 650; letter-spacing: .02em; }
    .meta { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; }
    .stage { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
    .stage-drafting { background: var(--accent-soft); border-color: #bcd2c7; color: var(--accent); }
    .stage-published { background: var(--accent); border-color: var(--accent); color: #fff; }
    .stage-failed { background: var(--warn-soft); border-color: #e2c4bc; color: var(--warn); }
    .split {
      display: grid; grid-template-columns: minmax(360px, 1fr) minmax(420px, 560px);
      gap: 24px; padding: 24px 28px 48px; align-items: start;
    }
    @media (max-width: 1000px) { .split { grid-template-columns: 1fr; } }
    .thread { display: flex; flex-direction: column; gap: 10px; min-height: 220px; }
    .msg { padding: 10px 12px; border-radius: var(--radius); background: #fff; border: 1px solid var(--line); }
    .msg-user { background: var(--accent-soft); border-color: #cfdfd6; }
    .msg-artifact { display: none; }
    .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .body { white-space: pre-wrap; }
    .composer { margin-top: 14px; }
    textarea, input[type="text"], input[type="file"] {
      width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--ink); font-size: 13px;
    }
    textarea { resize: vertical; }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    button {
      padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); cursor: pointer; font-size: 13px;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #274c41; color: #fff; }
    button.ghost { background: transparent; }
    .upload { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .upload input[type="file"] { flex: 1; background: transparent; }
    .panel { display: flex; flex-direction: column; gap: 14px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
    .card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
    .card h2 small { font-weight: 400; }
    .card.err { background: var(--warn-soft); border-color: #e2c4bc; }
    .card.err h2 { color: var(--warn); }
    .card.ok { background: var(--accent-soft); border-color: #bcd2c7; }
    .card.ok h2 { color: var(--accent); }
    dl { margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 4px 12px; }
    dt { color: var(--muted); font-size: 12px; }
    dd { margin: 0; }
    .steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .steps li { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
    .steps em { font-style: normal; color: var(--muted); }
    .s-ok span::before { content: "● "; color: var(--accent); }
    .s-failed span::before { content: "✕ "; color: var(--warn); }
    .s-failed em { color: var(--warn); }
    .node { border-top: 1px dashed var(--line); padding: 10px 0 4px; }
    .node:first-of-type { border-top: none; }
    .node summary { cursor: pointer; font-size: 13px; }
    .node label { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
    .node label input, .node label textarea { margin-top: 3px; }
    .bindings { display: flex; flex-direction: column; gap: 6px; }
    .check {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    }
    .check input { width: auto; }
    .check code { font-size: 11px; color: var(--muted); }
    .check em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 13px; margin: 0; }
    .hint { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 2px 0; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
